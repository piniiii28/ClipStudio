[project]
name = "clipstudio"
version = "0.2.2"
description = "Convierte videos largos en clips verticales con subtitulos, de forma local."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "faster-whisper>=1.1",
    "yt-dlp>=2025.1.1",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.26",
    "websocket-client>=1.8,<2",
    "pywebview>=6,<7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyinstaller>=6,<7",
    "pillow>=11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
