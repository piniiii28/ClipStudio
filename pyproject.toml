[project]
name = "clipstudio"
version = "0.1.0"
description = "Convierte videos largos en clips verticales con subtitulos, de forma local."
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "faster-whisper>=1.1",
    "yt-dlp>=2025.1.1",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
